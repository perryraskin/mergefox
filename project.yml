name: Mergefox
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 956T9YFK9F
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '0.1.14'
    CURRENT_PROJECT_VERSION: 202610120454
packages:
  gitdiff:
    url: https://github.com/tornikegomareli/gitdiff.git
    exactVersion: 0.1.0
targets:
  Mergefox:
    type: application
    platform: iOS
    sources: [App, Shared]
    configFiles:
      Debug: Config/OAuth.xcconfig
      Release: Config/OAuth.xcconfig
    entitlements:
      path: App/Mergefox.entitlements
      properties:
        keychain-access-groups: ['$(AppIdentifierPrefix)com.perryraskin.mergepocket']
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Mergefox
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLName: com.perryraskin.mergepocket
            CFBundleURLSchemes: [mergefox, mergepocket]
        GitLabOAuthClientID: $(GITLAB_OAUTH_CLIENT_ID)
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.perryraskin.mergepocket
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: gitdiff
      - target: MergefoxShare
        embed: true
    scheme:
      testTargets: [MergefoxTests]
  MergefoxShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: Shared
      - path: App
        excludes: [MergefoxApp.swift, Info.plist, Mergefox.entitlements, Assets.xcassets]
    entitlements:
      path: ShareExtension/MergefoxShare.entitlements
      properties:
        keychain-access-groups: ['$(AppIdentifierPrefix)com.perryraskin.mergepocket']
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Mergefox
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.perryraskin.mergepocket.share
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: '$(inherited) SHARE_EXTENSION'
        SKIP_INSTALL: YES
    dependencies:
      - package: gitdiff
  MergefoxTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Mergefox
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
